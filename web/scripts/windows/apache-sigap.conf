# Contoh konfigurasi Apache XAMPP untuk SIGAP JUMBARA.
# Salin isi file ini ke akhir C:\xampp\apache\conf\extra\httpd-vhosts.conf, sesuaikan
# ServerName dan path, lalu restart Apache. Lihat docs/21-DEPLOY-WINDOWS.md bagian 5.
#
# Pastikan modul berikut TIDAK diberi tanda # di C:\xampp\apache\conf\httpd.conf:
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule headers_module modules/mod_headers.so
#   LoadModule rewrite_module modules/mod_rewrite.so
#   LoadModule deflate_module modules/mod_deflate.so
#   LoadModule expires_module modules/mod_expires.so

<VirtualHost *:80>
    ServerName sigapjumbara.id
    ServerAlias www.sigapjumbara.id localhost

    # File statis disajikan langsung oleh Apache (cepat), sisanya ke Waitress.
    Alias /static/ "C:/sigap-jumbara/web/staticfiles/"
    <Directory "C:/sigap-jumbara/web/staticfiles">
        Require all granted
        Options -Indexes
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
        <FilesMatch "\.(html|json)$">
            ExpiresDefault "access plus 0 seconds"
        </FilesMatch>
        Header set X-Content-Type-Options "nosniff"
    </Directory>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 180
    ProxyPass /static/ !
    ProxyPass / http://127.0.0.1:8000/ retry=0 timeout=180
    ProxyPassReverse / http://127.0.0.1:8000/

    # Cloudflare Tunnel / HTTPS berada di depan Apache: beri tahu Django bahwa aslinya HTTPS.
    RequestHeader set X-Forwarded-Proto "https"

    # Batas unggahan 12 MB (foto maksimal 5 MB + isian lain).
    LimitRequestBody 12582912

    ErrorLog "logs/sigap-error.log"
    CustomLog "logs/sigap-access.log" combined
</VirtualHost>

# Folder privat (foto, cadangan) dan file .env TIDAK boleh berada di bawah Alias/DocumentRoot.
# Hanya C:/sigap-jumbara/web/staticfiles yang disajikan Apache.
